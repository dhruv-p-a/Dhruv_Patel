<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Dhruv Patel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

    <nav class="container" style="padding: 40px 60px;">
        <a href="projects.html" class="btn-outline" style="padding: 10px 20px; font-size: 12px;">&larr; BACK TO PROJECTS</a>
    </nav>

    <main class="container">
        <div id="projectDetailContent" data-aos="fade-up">
            <!-- Top Container for Project Banner -->
            <div style="height: 400px; border-radius: 12px; background-color: #050505; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 48px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 20px;">
                <img id="projImage" src="" alt="Project Banner" style="width: 100%; height: 100%; object-fit: contain; object-position: center;">
            </div>

            <h1 id="projTitle" style="font-size: clamp(32px, 5vw, 48px); font-weight: 700; margin-bottom: 16px;">Project Title</h1>
            <p id="projSubtitle" class="hero-subtitle" style="text-align: left; margin-bottom: 32px; color: var(--accent-cyan);">Category</p>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 64px; border-top: 1px solid var(--divider); padding-top: 48px;">
                <div>
                    <h3 style="margin-bottom: 24px; font-weight: 700;">Overview</h3>
                    <p id="projDesc" style="color: var(--text-secondary); line-height: 1.8; font-size: 16px;">Project description will appear here...</p>
                </div>
                <div>
                    <h3 style="margin-bottom: 24px; font-weight: 700;">Tech Stack</h3>
                    <div id="projStack" class="skill-pills">
                        <!-- Stack items will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container" style="padding: 100px 60px; text-align: center;">
        <p style="color: var(--text-secondary); font-size: 14px;">&copy; 2024 Dhruv Patel</p>
    </footer>

    <div class="custom-cursor"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // Logic to populate data based on URL ID
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        const projects = {
            'android-pentest': {
                title: 'Android Pen-Testing App',
                subtitle: 'Mobile Vulnerability Assessment Toolkit',
                image: '.idea/image/persevex.png',
                desc: 'A comprehensive mobile application designed for security professionals and ethical hackers. Built entirely in Kotlin, it allows users to perform various vulnerability assessments directly from their Android device. Features include network reconnaissance, local vulnerability scanning, and secure communication auditing.',
                stack: ['Kotlin', 'Android SDK', 'Nmap', 'SQLite']
            },
            'threat-intel': {
                title: 'Threat Intel Dashboard',
                subtitle: 'Real-time Threat Monitoring',
                image: '.idea/image/elevance skills technology.jpg',
                desc: 'An automated dashboard that aggregates threat feeds from various security vendors. Built with performance in mind to provide instant notifications on critical vulnerabilities. It uses a high-performance backend to track and visualize emerging threats in real-time.',
                stack: ['Python', 'FastAPI', 'Redis', 'D3.js']
            },
            'web-scanner': {
                title: 'Web Vulnerability Scanner',
                subtitle: 'Automated Security Auditing',
                image: '.idea/image/mywall.jpeg',
                desc: 'A distributed web scanner designed to identify misconfigurations and common vulnerabilities in web applications at scale. Automated tool designed to identify common web security flaws like XSS, SQLi, and misconfigurations.',
                stack: ['Python', 'Docker', 'OWASP ZAP API']
            }
        };

        if (id && projects[id]) {
            const p = projects[id];
            document.getElementById('projTitle').innerText = p.title;
            document.title = p.title + " | Dhruv Patel";
            document.getElementById('projSubtitle').innerText = p.subtitle;
            document.getElementById('projDesc').innerText = p.desc;
            document.getElementById('projImage').src = p.image;

            // Inject stack as pills
            const stackContainer = document.getElementById('projStack');
            stackContainer.innerHTML = p.stack.map(s => `<span class="skill-pill">${s}</span>`).join('');
        }

        // Custom Cursor Interaction
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            if (cursor) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            }
        });
    </script>
</body>
</html>
